<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCÓ PEÇAS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 10px 20px;
        }
        .admin-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
        .search-box {
            margin: 20px 0;
        }
        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .product {
            background: white;
            margin: 10px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            width: 200px;
            cursor: pointer;
        }
        #admin-panel {
            display: none;
            padding: 20px;
            background: white;
            border-radius: 5px;
            margin-top: 20px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>MOCÓ PEÇAS</h1>
        <button class="admin-btn" onclick="checkPassword()">Admin</button>
    </header>

    <div class="search-box">
        <input type="text" id="search" placeholder="Pesquisar produtos..." onkeyup="searchProduct()">
    </div>

    <div class="product-list" id="product-list">
        <!-- Produtos aparecem aqui -->
    </div>

    <div id="admin-panel">
        <h2>Painel Administrativo</h2>
        <input type="text" id="product-name" placeholder="Nome do produto">
        <input type="number" id="product-price" placeholder="Preço">
        <input type="number" id="product-stock" placeholder="Estoque">
        <button onclick="addProduct()">Adicionar Produto</button>

        <h3>Editar Produto</h3>
        <select id="edit-product">
            <!-- Produtos para edição aparecem aqui -->
        </select>
        <input type="number" id="edit-price" placeholder="Novo preço">
        <input type="number" id="edit-stock" placeholder="Novo estoque">
        <button onclick="editProduct()">Salvar Alterações</button>
    </div>

    <script>
        let products = [];

        function checkPassword() {
            let password = prompt("Digite a senha:");
            if (password === "#t65327385gwe") {
                document.getElementById("admin-panel").style.display = "block";
                updateEditOptions();
            } else {
                alert("Senha incorreta!");
            }
        }

        function addProduct() {
            let name = document.getElementById("product-name").value;
            let price = document.getElementById("product-price").value;
            let stock = document.getElementById("product-stock").value;

            if (name && price && stock) {
                products.push({ name, price, stock });
                updateProductList();
                updateEditOptions();
                document.getElementById("product-name").value = "";
                document.getElementById("product-price").value = "";
                document.getElementById("product-stock").value = "";
            } else {
                alert("Preencha todos os campos!");
            }
        }

        function updateProductList() {
            let productList = document.getElementById("product-list");
            productList.innerHTML = "";
            products.forEach((product, index) => {
                productList.innerHTML += `
                    <div class="product" onclick="selectProduct(${index})">
                        <h3>${product.name}</h3>
                        <p>Preço: R$${product.price}</p>
                        <p>Estoque: ${product.stock}</p>
                    </div>
                `;
            });
        }

        function updateEditOptions() {
            let editSelect = document.getElementById("edit-product");
            editSelect.innerHTML = "";
            products.forEach((product, index) => {
                let option = document.createElement("option");
                option.value = index;
                option.textContent = product.name;
                editSelect.appendChild(option);
            });
        }

        function editProduct() {
            let index = document.getElementById("edit-product").value;
            let newPrice = document.getElementById("edit-price").value;
            let newStock = document.getElementById("edit-stock").value;

            if (newPrice && newStock) {
                products[index].price = newPrice;
                products[index].stock = newStock;
                updateProductList();
                alert("Produto atualizado com sucesso!");
            } else {
                alert("Preencha os campos corretamente!");
            }
        }

        function searchProduct() {
            let query = document.getElementById("search").value.toLowerCase();
            let filtered = products.filter(p => p.name.toLowerCase().includes(query));
            let productList = document.getElementById("product-list");
            productList.innerHTML = "";
            filtered.forEach((product, index) => {
                productList.innerHTML += `
                    <div class="product">
                        <h3>${product.name}</h3>
                        <p>Preço: R$${product.price}</p>
                        <p>Estoque: ${product.stock}</p>
                    </div>
                `;
            });
        }
    </script>

</body>
          </html>
